<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>n0ise canvas combined</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050505;
      --panel:#0d0e0f;
      --panel2:#151719;
      --line:#2a2d31;
      --text:#eff3e8;
      --muted:#8c948b;
      --accent:#d7ff39;
      --hot:#ff3f71;
      --cyan:#28dfff;
      --lime:#9bff3d;
      --grey:#9aa0a6;
      --warn:#ffcf4a;
      --shadow:0 18px 60px rgba(0,0,0,.5);
      color-scheme:dark;
      font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit;color:inherit}
    button{background:#16191b;border:1px solid #33383d;border-radius:7px;padding:9px 11px;cursor:pointer;min-height:38px}
    button:hover{border-color:var(--accent);color:var(--accent)}
    button.primary{background:var(--accent);color:#080908;border-color:var(--accent);font-weight:800}
    button.ghost{background:transparent}
    button.icon{width:38px;padding:0;display:grid;place-items:center}
    button:disabled{opacity:.45;cursor:not-allowed}
    select,input[type="number"],input[type="text"]{background:#090a0b;border:1px solid #31363a;border-radius:7px;padding:9px;min-height:38px}
    input[type="range"]{width:100%;accent-color:var(--accent);min-height:34px}
    label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    canvas{display:block}
    .hidden{display:none!important}
    .app{width:100%;height:100%;position:relative}
    .logo{font-family:"Syne", system-ui, sans-serif;font-weight:800;letter-spacing:.06em}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
    .source{background:var(--cyan)} .effect{background:var(--hot)} .composite{background:var(--lime)} .format{background:var(--warn)} .overlay{background:#c6a4ff} .output{background:var(--grey)}

    .start{
      position:absolute;inset:0;display:grid;place-items:center;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 70% 20%, rgba(215,255,57,.14), transparent 24%),
        #050505;
      background-size:36px 36px,36px 36px,100% 100%;
      padding:24px;
    }
    .start-card{width:min(760px,100%);padding:28px;border:1px solid #252a25;background:rgba(8,9,9,.9);box-shadow:var(--shadow);border-radius:8px}
    .start h1{font-family:"Syne";font-size:clamp(48px,10vw,120px);line-height:.78;margin:0 0 16px;color:var(--accent)}
    .start p{margin:0 0 22px;color:var(--muted)}
    .start-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .start-grid button{text-align:left;padding:16px;min-height:62px}
    .start-grid small{display:block;color:var(--muted);margin-top:4px}

    .desktop{height:100%;display:grid;grid-template-columns:230px minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) 70px;background:#050505}
    .shelf,.inspector,.timeline,.mobile-panel{background:rgba(13,14,15,.96);border-color:#25292d}
    .shelf{grid-row:1/3;border-right:1px solid #25292d;display:flex;flex-direction:column;min-width:0}
    .shelf-head,.inspector-head,.mobile-head{padding:14px;border-bottom:1px solid #25292d;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .shelf-tabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid #25292d}
    .shelf-tabs button{flex:1;font-size:11px;padding:6px;min-height:30px}
    .node-list{overflow:auto;padding:10px;display:grid;gap:7px}
    .node-add{display:flex;align-items:center;justify-content:space-between;text-align:left}
    .node-add span:last-child{color:var(--muted);font-size:10px}
    .gen-panel{border-top:1px solid #25292d;padding:10px;display:grid;gap:8px;max-height:45%;overflow:auto}
    .workspace-wrap{position:relative;overflow:hidden;background:#070808;display:grid;grid-template-rows:auto 8px minmax(0,1fr)}
    .preview-pane{height:220px;min-height:0;background:#0b0c0d;border-bottom:1px solid #282d31;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px;overflow:hidden}
    .preview-pane.collapsed{height:0!important;padding:0;border:0;overflow:hidden}
    .graph-pane{position:relative;min-height:0;overflow:hidden}
    #workspace{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    .workspace-toolbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none;z-index:12}
    .workspace-toolbar .group{display:flex;gap:8px;pointer-events:auto}
    .hint{color:#a6afa1;font-size:11px;background:rgba(9,10,10,.8);border:1px solid #282d2c;border-radius:7px;padding:8px}
    .inspector{border-left:1px solid #25292d;overflow:hidden;display:flex;flex-direction:column}
    .inspector-body{padding:12px;overflow:auto;display:grid;gap:12px}
    .field{display:grid;gap:5px}
    .field-row{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center}
    .timeline{grid-column:2/4;border-top:1px solid #25292d;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px}
    .timebar{height:8px;background:#202327;border-radius:99px;overflow:hidden}
    .timebar div{height:100%;width:0;background:var(--accent)}

    .mobile{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#050505}
    .mobile-head{min-height:58px}
    .mobile-main{overflow:auto;padding:12px;display:grid;gap:12px}
    .preview-shell{position:relative;background:#080909;border:1px solid #292e32;border-radius:8px;overflow:hidden;min-height:240px;display:grid;place-items:center}
    #mobilePreview{width:100%;height:auto;max-height:56vh;object-fit:contain}
    .mobile-panel{border:1px solid #25292d;border-radius:8px;padding:12px;display:grid;gap:10px}
    .chips{display:flex;gap:8px;overflow:auto;padding-bottom:3px}
    .chips button{white-space:nowrap;font-size:12px}
    .stack{display:grid;gap:9px}
    .effect-card{border:1px solid #2b3035;background:#111315;border-radius:8px;overflow:hidden}
    .effect-card-head{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:8px;align-items:center;padding:10px}
    .effect-card-body{border-top:1px solid #282d31;padding:10px;display:grid;gap:9px}
    .bottom-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;border-top:1px solid #25292d;background:#0d0e0f}
    .bottom-bar button{font-size:11px;padding:8px 5px}
    .modal{position:absolute;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:18px;z-index:20}
    .modal-card{width:min(460px,100%);background:#101214;border:1px solid #31363a;border-radius:8px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px}
    .export-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .drop-active:after{content:"DROP MEDIA";position:absolute;inset:12px;border:2px dashed var(--accent);display:grid;place-items:center;color:var(--accent);background:rgba(0,0,0,.6);z-index:12;font-family:"Syne";font-size:34px}
    .preview-frame{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}
    .preview-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .preview-tabs{display:flex;gap:6px}
    .preview-tabs button.active{border-color:var(--accent);color:var(--accent)}
    #outputPreview{width:100%;height:100%;object-fit:contain;background:#050505;border:1px solid #252a2e;border-radius:7px}
    .preview-divider{height:8px;cursor:row-resize;background:#171a1d;z-index:5;border-top:1px solid #282d31;border-bottom:1px solid #282d31}
    .floating-monitor{position:absolute;right:320px;top:86px;width:280px;background:#101214;border:1px solid #d7ff39;border-radius:8px;box-shadow:var(--shadow);z-index:16;padding:10px;display:grid;gap:8px}
    .floating-monitor.hidden{display:none!important}
    .floating-monitor canvas{width:100%;aspect-ratio:16/9;background:#050505;border:1px solid #282d31}
    .drawer{position:fixed;top:0;bottom:0;right:0;width:min(380px,100vw);background:#0d0e0f;border-left:1px solid #30353a;box-shadow:var(--shadow);z-index:40;display:none;grid-template-rows:auto auto minmax(0,1fr)}
    .drawer.open{display:grid!important;visibility:visible!important;opacity:1!important;z-index:9999!important}
    .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #282d31}
    .drawer-tabs{display:flex;gap:6px;overflow:auto;padding:8px;border-bottom:1px solid #282d31}
    .drawer-tabs button{font-size:10px;min-height:30px;padding:5px 8px;white-space:nowrap}
    .drawer-body{overflow:auto;padding:10px;display:grid;gap:7px}
    .outline-row{display:grid;grid-template-columns:auto minmax(0,1fr) repeat(3,34px);gap:7px;align-items:center;background:#121416;border:1px solid #2b3035;border-radius:7px;padding:8px}
    .outline-row.active{border-color:var(--accent)}
    .outline-title{min-width:0}
    .outline-title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
    .outline-title small{color:var(--muted);font-size:10px}
    .ratio-bar{display:flex;gap:7px;overflow:auto;padding:8px;background:#101214;border-bottom:1px solid #282d31}
    .ratio-bar button.active{border-color:var(--accent);color:var(--accent)}
    .context-menu{position:absolute;z-index:30;background:#101214;border:1px solid #363c42;border-radius:8px;box-shadow:var(--shadow);padding:6px;display:none;min-width:190px}
    .context-menu.open{display:grid}
    .context-menu button{text-align:left;border:0;background:transparent;border-radius:5px;min-height:30px}
    .hyper{position:absolute;inset:20px;background:#080909;border:1px solid #d7ff39;border-radius:8px;box-shadow:var(--shadow);z-index:25;display:none;grid-template-rows:auto 180px minmax(0,1fr)}
    .hyper.open{display:grid}
    .hyper-head{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #30353a}
    .hyper-preview{padding:10px;border-bottom:1px solid #30353a;background:#101214}
    .hyper-preview canvas{height:100%;max-width:100%;margin:auto;background:#050505;border:1px solid #282d31}
    .select-box{position:absolute;border:1px solid var(--accent);background:rgba(215,255,57,.12);z-index:9;pointer-events:none}
    @media (max-width:700px){
      .desktop{display:none}
      .drawer{right:0;width:100%;top:auto;height:74%;border-top:1px solid #30353a}
      .preview-pane,.preview-divider,.floating-monitor{display:none!important}
      .start-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div id="app" class="app">
  <section id="start" class="start">
    <div class="start-card">
      <h1>n0ise</h1>
      <p>Node canvas, mobile stack, procedural signal damage, and media-reactive generative systems in one offline file.</p>
      <div class="start-grid">
        <button data-start="blank-black"><b>Blank Black</b><small>solid source to output</small></button>
        <button data-start="blank-white"><b>Blank White</b><small>clean white signal</small></button>
        <button data-start="generative-noise"><b>Generative Noise</b><small>build a moving graph</small></button>
        <button data-start="generative-media"><b>Generative Image/Video Seed</b><small>upload then generate</small></button>
        <button data-start="desktop"><b>Desktop Node Editor</b><small>TouchDesigner-style workspace</small></button>
        <button data-start="mobile"><b>Mobile Editor</b><small>linear effect stack</small></button>
        <button data-start="import"><b>Import Image/Video</b><small>file, camera, or drop</small></button>
        <button data-start="paste"><b>Paste Image</b><small>clipboard seed</small></button>
      </div>
    </div>
  </section>

  <section id="desktop" class="desktop hidden">
    <aside class="shelf">
      <div class="shelf-head"><div class="logo">n0ise</div><button id="toStart" class="icon" title="Start">⌂</button></div>
      <div class="shelf-tabs">
        <button data-filter="source">SRC</button><button data-filter="effect">FX</button><button data-filter="composite">COMP</button>
        <button data-filter="format">FMT</button><button data-filter="preset">PRE</button>
      </div>
      <div id="nodeList" class="node-list"></div>
      <div class="gen-panel">
        <b>GENERATIVE</b>
        <div class="field"><label>Source</label><select id="genSource"></select></div>
        <div class="field"><label>Style</label><select id="genStyle"></select></div>
        <div class="field"><label>Complexity <span id="complexityVal">5</span></label><input id="genComplexity" type="range" min="2" max="10" value="5"></div>
        <div class="field"><label>Motion <span id="motionVal">45</span></label><input id="genMotion" type="range" min="0" max="100" value="45"></div>
        <div class="field"><label>Chaos <span id="chaosVal">35</span></label><input id="genChaos" type="range" min="0" max="100" value="35"></div>
        <button id="generateGraph" class="primary">Generate Graph</button>
        <button id="randomizeParams">Randomize Params</button>
        <button id="useUploaded">Use Uploaded Media</button>
        <button id="makeWeirder">Make weirder</button>
        <button id="makeCleaner">Make cleaner</button>
        <button id="morePrint">More print</button>
        <button id="moreDecay">More video decay</button>
        <button id="moreType">More typographic</button>
      </div>
    </aside>
    <main id="workspaceWrap" class="workspace-wrap">
      <div id="previewPane" class="preview-pane">
        <div class="preview-frame">
          <div class="preview-head">
            <b>PREVIEW</b>
            <div class="preview-tabs">
              <button id="previewOutput" class="active">Output</button>
              <button id="previewSelected">Selected Node</button>
              <button id="previewGroup">Group Preview</button>
            </div>
          </div>
          <canvas id="outputPreview"></canvas>
        </div>
        <div style="display:grid;gap:8px;align-content:start">
          <button id="collapsePreview">Collapse</button>
          <button id="floatPreview">Float</button>
        </div>
      </div>
      <div id="previewDivider" class="preview-divider"></div>
      <div id="graphPane" class="graph-pane">
        <canvas id="workspace"></canvas>
        <div class="workspace-toolbar">
          <div class="group">
            <button id="frameAll">Frame All</button>
            <button id="centerOutput">Center Output</button>
          <button id="layersBtn">Outline</button>
          <button id="ratiosBtn">Ratios</button>
          <button id="overlaysBtn">Overlays</button>
            <button id="previewBtn">Preview</button>
            <button id="groupBtn">Group</button>
            <button id="hideBtn">Hide</button>
            <button id="soloBtn">Solo</button>
            <button id="switchMobile">Mobile</button>
            <button id="uploadBtn">Upload</button>
          </div>
          <div class="hint">space/middle/alt drag pan · wheel zoom · drag ports to connect</div>
        </div>
        <div id="nodeMonitor" class="floating-monitor hidden">
          <div style="display:flex;justify-content:space-between;align-items:center"><b>NODE MONITOR</b><button id="closeMonitor" class="icon">×</button></div>
          <canvas id="nodeMonitorCanvas"></canvas>
          <div id="nodeMonitorControls" class="inspector-body" style="padding:0;max-height:240px"></div>
        </div>
        <div id="contextMenu" class="context-menu"></div>
        <div id="selectBox" class="select-box hidden"></div>
        <div id="hyperEditor" class="hyper">
          <div class="hyper-head"><b id="hyperTitle">GROUP</b><button id="closeHyper">Back to Main Graph</button></div>
          <div class="hyper-preview"><canvas id="hyperPreview"></canvas></div>
          <canvas id="hyperCanvas"></canvas>
        </div>
      </div>
    </main>
    <aside class="inspector">
      <div class="inspector-head"><b>INSPECTOR</b><button id="exportBtn">Export</button></div>
      <div id="inspectorBody" class="inspector-body"></div>
    </aside>
    <footer class="timeline">
      <button id="playBtn">PLAY</button>
      <div class="timebar"><div id="timeFill"></div></div>
      <div>
        <button id="pngQuick">PNG</button>
        <button id="recordBtn">WEBM</button>
      </div>
    </footer>
  </section>

  <section id="mobile" class="mobile hidden">
    <header class="mobile-head">
      <div class="logo">n0ise</div>
      <div><button id="toDesktop">Desktop</button> <button id="mobileExport">Export</button></div>
    </header>
    <main class="mobile-main">
      <div class="preview-shell"><canvas id="mobilePreview"></canvas></div>
      <div class="mobile-panel">
        <div class="field"><label>Source</label><select id="mobileSource"></select></div>
        <div class="timeline" style="display:grid;grid-template-columns:auto 1fr auto;padding:0;border:0;background:transparent">
          <button id="mobilePlay">PLAY</button><div class="timebar"><div id="mobileTimeFill"></div></div><button id="mobilePaste">Paste</button>
        </div>
        <div id="presetChips" class="chips"></div>
      </div>
      <div id="mobileStack" class="stack"></div>
    </main>
    <nav class="bottom-bar">
      <button id="addEffect">Add Effect</button>
      <button id="shuffleStack">Shuffle</button>
      <button id="randomizeStack">Randomize</button>
      <button id="mobileUpload">Upload</button>
    </nav>
  </section>

  <div id="exportModal" class="modal hidden">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>EXPORT</b><button id="closeExport" class="icon">×</button></div>
      <div class="field"><label>Format</label><select id="exportFormat"><option value="png">PNG still</option><option value="jpeg">JPEG still</option><option value="webm">WebM animation</option><option value="mp4">MP4 animation</option><option value="gif">GIF animation</option><option value="iphone">iPhone compatible animation</option></select></div>
      <div class="field"><label>Size</label><select id="exportSize"><option value="preview">Preview</option><option value="2x">2x</option><option value="1080">1080</option><option value="4k">4K</option><option value="original">Original Ratio</option></select></div>
      <div class="field"><label>Duration seconds <span id="durationVal">4</span></label><input id="exportDuration" type="range" min="1" max="12" step="1" value="4"></div>
      <div class="field"><label>FPS</label><select id="exportFps"><option>12</option><option selected>24</option><option>30</option></select></div>
      <label style="display:flex;gap:8px;align-items:center"><input id="exportLoop" type="checkbox" checked> Loop animation</label>
      <div class="field"><label>JPEG Quality <span id="qualityVal">0.92</span></label><input id="jpegQuality" type="range" min=".2" max="1" step=".01" value=".92"></div>
      <p id="webmNote" style="color:var(--muted);font-size:12px;margin:0"></p>
      <div class="export-grid"><button id="doExport" class="primary">Export</button><button id="doRecord">Record Animation</button></div>
    </div>
  </div>

  <div id="layersDrawer" class="drawer">
    <div class="drawer-head"><b>NODE OUTLINE</b><button id="closeLayers" class="icon">×</button></div>
    <div class="drawer-tabs" id="layersTabs"></div>
    <div id="layersList" class="drawer-body"></div>
  </div>

  <div id="overlaysDrawer" class="drawer">
    <div class="drawer-head"><b>OVERLAYS</b><button id="closeOverlays" class="icon">×</button></div>
    <div class="drawer-tabs"><button id="addTextOverlay">+ Text</button><button id="addSolidOverlay">+ Solid</button><button id="addImageOverlay">+ Image</button></div>
    <div id="overlaysList" class="drawer-body"></div>
  </div>

  <div id="ratioDrawer" class="drawer">
    <div class="drawer-head"><b>ARTBOARD RATIOS</b><button id="closeRatios" class="icon">×</button></div>
    <div id="ratioBar" class="ratio-bar"></div>
    <div class="drawer-body">
      <div class="field"><label>Width</label><input id="artboardW" type="number" min="128" max="7680"></div>
      <div class="field"><label>Height</label><input id="artboardH" type="number" min="128" max="7680"></div>
      <label style="display:flex;gap:8px;align-items:center"><input id="lockRatio" type="checkbox" checked> Lock aspect</label>
      <button id="applyCustomRatio" class="primary">Apply Custom</button>
    </div>
  </div>

  <input id="fileInput" class="hidden" type="file" accept="image/*,video/*">
  <input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment">
</div>

<script>
(() => {
  "use strict";
  const TAU = Math.PI * 2;
  const app = document.getElementById("app");
  const $ = id => document.getElementById(id);
  function r(min,max,value,step){ return { min,max,value,step,label:"" }; }
  const RATIOS = {"1:1":[1,1],"4:5":[4,5],"9:16":[9,16],"16:9":[16,9],"3:4":[3,4],"4:3":[4,3],"CUSTOM":null};
  const BLENDS = ["source-over","multiply","screen","overlay","darken","lighten","color-dodge","color-burn","hard-light","soft-light","difference","exclusion","hue","saturation","color","luminosity"];
  const EFFECTS = {
    none:{ label:"NONE", icon:"-", params:{} },
    glitch:{ label:"GLITCH", icon:"GL", params:{ seed:r(1,999,42,1), amount:r(0,100,46,1), block:r(2,80,18,1), rgb:r(0,42,13,1), tear:r(0,80,22,1), channels:r(0,1,1,1), red:r(-40,40,12,1), green:r(-40,40,0,1), blue:r(-40,40,-12,1) }},
    vhs:{ label:"VHS", icon:"VH", params:{ seed:r(1,999,77,1), noise:r(0,1,.35,.01), shift:r(0,60,18,1), bleed:r(0,34,14,1), roll:r(0,80,18,1), wobble:r(0,40,12,1), channels:r(0,1,1,1) }},

    ws.onpointerup=e=>{ if(connecting){ const p=screenToWorld(e.offsetX,e.offsetY), inn=hitPort(p.x,p.y,"in"); if(inn && inn.node.id!==connecting.node.id) connect(connecting.node,connecting.port,inn.node,inn.port); connecting=null; } if(drag?.type==="node") tryInsertNodeOnConnection(drag.node); if(drag?.type==="box") finishBoxSelect(drag.sx,drag.sy,e.offsetX,e.offsetY); highlightedConnectionId=null; drag=null; };
    ws.onwheel=e=>{ e.preventDefault(); const before=screenToWorld(e.offsetX,e.offsetY), next=clamp(state.viewport.scale*Math.exp(-e.deltaY*.001),.05,8); state.viewport.scale=next; state.viewport.x=e.offsetX-before.x*next; state.viewport.y=e.offsetY-before.y*next; };
    app.ondragover=e=>{e.preventDefault();app.classList.add("drop-active");}; app.ondragleave=()=>app.classList.remove("drop-active"); app.ondrop=e=>{e.preventDefault();app.classList.remove("drop-active"); const f=e.dataTransfer.files[0]; if(f)loadFile(f);};
    document.onpaste=e=>{ const f=[...e.clipboardData.files].find(x=>x.type.startsWith("image/")); if(f) loadFile(f); };
    document.onkeydown=e=>{ if(e.target.closest("input,textarea,select"))return; if(e.key==="Escape"){state.selectedNodeIds.clear();state.selectedNodeId=null;closeDrawers();closeContextMenu();inspect();buildLayers();} if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="g"){e.preventDefault();groupSelected();} if(e.key==="Backspace"||e.key==="Delete"){e.preventDefault();deleteSelected();} };
    window.onresize=()=>{ if(innerWidth<700 && state.mode==="desktop") openMode("mobile"); };
  }
  function setPreviewMode(mode){ state.viewports.outputPreview.mode=mode; ["previewOutput","previewSelected","previewGroup"].forEach(id=>$(id).classList.remove("active")); $(mode==="selected"?"previewSelected":mode==="group"?"previewGroup":"previewOutput").classList.add("active"); }
  function openContextMenu(x,y,n){ contextNodeId=n.id; const menu=$("contextMenu"); menu.innerHTML=["Preview Node","Hide / Show","Solo","Lock","Duplicate","Group Selected","Collapse","Delete","Disconnect Inputs","Disconnect Outputs"].map(a=>`<button data-action="${a}">${a}</button>`).join(""); Object.assign(menu.style,{left:x+"px",top:y+"px"}); menu.classList.add("open"); }
  function closeContextMenu(){ $("contextMenu")?.classList.remove("open"); }
  function runContextAction(action){ const n=state.graph.nodes.find(x=>x.id===contextNodeId); if(!n)return; if(action==="Preview Node")openNodeMonitor(n.id); if(action==="Hide / Show")n.visible=n.visible===false; if(action==="Solo")n.solo=!n.solo; if(action==="Lock")n.locked=!n.locked; if(action==="Duplicate")duplicateNode(n); if(action==="Group Selected")groupSelected(); if(action==="Collapse")n.collapsed=!n.collapsed; if(action==="Delete"){selectNode(n.id);deleteSelected();} if(action==="Disconnect Inputs")state.graph.connections=state.graph.connections.filter(c=>c.to!==n.id); if(action==="Disconnect Outputs")state.graph.connections=state.graph.connections.filter(c=>c.from!==n.id); closeContextMenu(); inspect(); buildLayers(); }
  function updateSelectBox(x1,y1,x2,y2){ const el=$("selectBox"), x=Math.min(x1,x2), y=Math.min(y1,y2); Object.assign(el.style,{left:x+"px",top:y+"px",width:Math.abs(x2-x1)+"px",height:Math.abs(y2-y1)+"px"}); }
  function finishBoxSelect(x1,y1,x2,y2){ $("selectBox").classList.add("hidden"); const a=screenToWorld(Math.min(x1,x2),Math.min(y1,y2)), b=screenToWorld(Math.max(x1,x2),Math.max(y1,y2)); state.selectedNodeIds.clear(); state.graph.nodes.forEach(n=>{ if(n.x>=a.x&&n.x+n.w<=b.x&&n.y>=a.y&&n.y+n.h<=b.y) state.selectedNodeIds.add(n.id); }); state.selectedNodeId=[...state.selectedNodeIds].at(-1)||null; inspect(); buildLayers(); }
  function connect(from,fromPort,to,toPort){ const def=NODE_DEFS[to.type]; if(!def.multi) state.graph.connections=state.graph.connections.filter(c=>!(c.to===to.id&&c.toPort===toPort)); state.graph.connections.push({id:uid("c"),from:from.id,fromPort,to:to.id,toPort}); }
  function isUnaryNode(n){ const d=NODE_DEFS[n.type]; return d.category!=="source"&&d.category!=="output"&&(d.inputs||[]).length===1&&(d.outputs||[]).length===1; }
  function nearestConnectionToNodeCenter(n){ const sx=worldToScreen(n.x+n.w/2,n.y+n.h/2); let best=null; for(const con of state.graph.connections){ if(con.from===n.id||con.to===n.id)continue; const pts=connectionPoints(con); if(!pts)continue; const a=worldToScreen(pts.ap.x,pts.ap.y), b=worldToScreen(pts.bp.x,pts.bp.y); const d=pointSegDist(sx.x,sx.y,a.x,a.y,b.x,b.y); if(!best||d<best.distance)best={connection:con,distance:d}; } return best; }
  function pointSegDist(px,py,x1,y1,x2,y2){ const dx=x2-x1,dy=y2-y1,t=clamp(((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy||1),0,1),x=x1+t*dx,y=y1+t*dy; return Math.hypot(px-x,py-y); }
  function updateInsertHighlight(n){ highlightedConnectionId=null; if(!isUnaryNode(n))return; if(state.graph.connections.some(c=>c.from===n.id||c.to===n.id))return; const hit=nearestConnectionToNodeCenter(n); if(hit&&hit.distance<28) highlightedConnectionId=hit.connection.id; }
  function tryInsertNodeOnConnection(n){ if(!isUnaryNode(n))return false; if(state.graph.connections.some(c=>c.from===n.id||c.to===n.id))return false; const hit=nearestConnectionToNodeCenter(n); if(!hit||hit.distance>28)return false; const old=hit.connection; state.graph.connections=state.graph.connections.filter(c=>c.id!==old.id); connectById(old.from,old.fromPort,n.id,"in"); connectById(n.id,"out",old.to,old.toPort); highlightedConnectionId=null; return true; }
  function connectById(from,fromPort,to,toPort){ const a=state.graph.nodes.find(n=>n.id===from), b=state.graph.nodes.find(n=>n.id===to); if(a&&b)connect(a,fromPort,b,toPort); }
  function frameAll(){ if(!state.graph?.nodes.length)return; const xs=state.graph.nodes.flatMap(n=>[n.x,n.x+n.w]), ys=state.graph.nodes.flatMap(n=>[n.y,n.y+n.h]); const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys), rect=$("workspace").getBoundingClientRect(); const scale=clamp(Math.min(rect.width/(maxx-minx+220),rect.height/(maxy-miny+220)),.05,2); state.viewport.scale=scale; state.viewport.x=rect.width/2-(minx+maxx)/2*scale; state.viewport.y=rect.height/2-(miny+maxy)/2*scale; }
  function centerOutput(){ const out=state.graph.nodes.find(n=>n.type==="output"); if(!out)return; const rect=$("workspace").getBoundingClientRect(); state.viewport.x=rect.width/2-(out.x+out.w/2)*state.viewport.scale; state.viewport.y=rect.height/2-(out.y+out.h/2)*state.viewport.scale; }

  function init() {
    state.graph = blankGraph("noise");
    $("genSource").innerHTML=["Noise","Gradient","Solid","Image Seed","Video Seed","Camera"].map(x=>`<option>${x}</option>`).join("");
    $("genStyle").innerHTML=[...Object.keys(templates),"Random"].map(x=>`<option>${x}</option>`).join("");
    bind(); ui(); requestAnimationFrame(tick);
  }
  window.n0ise = { state, EFFECTS, NODE_DEFS, renderGraph, evalNode, applyEffect, applyStackToCanvas, drawSourceNode };
  init();
})();
